[workspace]
resolver = "2"
members = [
    "crates/english",
    "crates/english-core",
    "crates/extractor",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/english"
authors = ["gold-silver-copper"]
rust-version = "1.85"

[workspace.dependencies]
english-core = { path = "crates/english-core" }
english = { path = "crates/english" }
phf = { version = "0.12", default-features = false, features = ["macros"] }
csv = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[profile.release]
opt-level = 2 # fast and small wasm

[profile.dev.package."*"]
opt-level = 2
